<title id="title">Khaled Al-Haj Salem — Senior Software Engineer, Backend and Systems Architect</title>
<desc id="desc">SaaS platforms, FinTech and payments, e-invoicing for ZATCA. Gaza, Palestine. The QR code opens his LinkedIn profile.</desc>
<style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .ink { fill: #0f172a; } .muted { fill: #55647d; } .faint { fill: #8a97ab; } .accent { fill: #059669; }
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .blk { opacity: 0; animation: blk 6.4s linear infinite; }
    @keyframes blk { 0%, 100% { opacity: 0; } 6% { opacity: 1; } 30% { opacity: .0; } }
    .cover { transform: translateY(190px); animation: reveal 1.7s cubic-bezier(.6,0,.4,1) .5s backwards; }
    @keyframes reveal { from { transform: translateY(0); } }
    .scan { opacity: 0; animation: scan 7s cubic-bezier(.6,0,.4,1) .5s infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 2% { opacity: .95; } 24% { transform: translateY(190px); opacity: .95; } 27%, 100% { transform: translateY(190px); opacity: 0; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
</style>
